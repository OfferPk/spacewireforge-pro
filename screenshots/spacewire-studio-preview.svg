<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 34, 0.85)"/>
      <stop offset="100%" stop-color="rgba(8, 13, 25, 0.75)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="70" fill="rgba(5, 8, 17, 0.95)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
  
  <rect x="30" y="15" width="40" height="40" rx="8" fill="rgba(255, 215, 0, 0.15)" stroke="#ffd700" stroke-width="1"/>
  <text x="50" y="41" fill="#ffd700" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">SPW</text>

  <text x="85" y="36" fill="url(#cyanGold)" font-family="sans-serif" font-size="20" font-weight="bold">SpaceWireForge Pro</text>
  <text x="85" y="52" fill="#8393a8" font-family="sans-serif" font-size="11" letter-spacing="1">ECSS-E-ST-50-12C &amp; ECSS-E-ST-50-52C RMAP TELEMETRY STUDIO</text>

  <rect x="910" y="20" width="255" height="30" rx="15" fill="rgba(0, 229, 255, 0.1)" stroke="#00e5ff" stroke-width="1"/>
  <circle cx="928" cy="35" r="5" fill="#00e5ff" filter="url(#glow)"/>
  <text x="942" y="40" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">SPW LINK: RUN (100 Mbps)</text>

  <!-- Navigation Tabs -->
  <rect x="0" y="70" width="1200" height="45" fill="rgba(12, 18, 34, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="50" y="98" fill="#00e5ff" font-family="sans-serif" font-size="13" font-weight="bold">RMAP &amp; Packet Studio</text>
  <line x1="40" y1="113" x2="200" y2="113" stroke="#00e5ff" stroke-width="2"/>
  <text x="240" y="98" fill="#8393a8" font-family="sans-serif" font-size="13">Character &amp; Token Dissector</text>
  <text x="470" y="98" fill="#8393a8" font-family="sans-serif" font-size="13">Spacecraft Telemetry (AOCS/OBC)</text>
  <text x="730" y="98" fill="#8393a8" font-family="sans-serif" font-size="13">ECSS &amp; Mission Security Audit</text>
  <text x="980" y="98" fill="#8393a8" font-family="sans-serif" font-size="13">EGSE Gateway Rules</text>

  <!-- Left Card: RMAP Synthesizer -->
  <rect x="30" y="140" width="550" height="620" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 215, 0, 0.2)" stroke-width="1"/>
  <text x="55" y="175" fill="#ffd700" font-family="sans-serif" font-size="16" font-weight="bold">RMAP Command Synthesizer (ECSS-E-ST-50-52C)</text>
  <rect x="440" y="158" width="115" height="22" rx="4" fill="rgba(255, 215, 0, 0.2)"/>
  <text x="497" y="174" fill="#ffd700" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">WRITE COMMAND</text>
  <line x1="55" y1="190" x2="555" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="55" y="225" fill="#8393a8" font-family="sans-serif" font-size="11" font-weight="bold">COMMAND CLASSIFICATION</text>
  <rect x="55" y="235" width="235" height="38" rx="6" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(255,255,255,0.15)"/>
  <text x="70" y="259" fill="#f0f4f8" font-family="'JetBrains Mono', monospace" font-size="12">RMAP Verified Write</text>

  <text x="320" y="225" fill="#8393a8" font-family="sans-serif" font-size="11" font-weight="bold">TARGET LOGICAL ADDRESS</text>
  <rect x="320" y="235" width="235" height="38" rx="6" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(255,255,255,0.15)"/>
  <text x="335" y="259" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="13">0xFE (Target Node)</text>

  <text x="55" y="305" fill="#8393a8" font-family="sans-serif" font-size="11" font-weight="bold">AUTHORIZATION KEY</text>
  <rect x="55" y="315" width="235" height="38" rx="6" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(255,255,255,0.15)"/>
  <text x="70" y="339" fill="#ffd700" font-family="'JetBrains Mono', monospace" font-size="13">0x55 (Valid Key)</text>

  <text x="320" y="305" fill="#8393a8" font-family="sans-serif" font-size="11" font-weight="bold">32-BIT MEMORY ADDRESS</text>
  <rect x="320" y="315" width="235" height="38" rx="6" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(255,255,255,0.15)"/>
  <text x="335" y="339" fill="#f0f4f8" font-family="'JetBrains Mono', monospace" font-size="13">0x40000000</text>

  <text x="55" y="385" fill="#8393a8" font-family="sans-serif" font-size="11" font-weight="bold">PAYLOAD DATA STRING</text>
  <rect x="55" y="395" width="500" height="38" rx="6" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(255,255,255,0.15)"/>
  <text x="70" y="419" fill="#f0f4f8" font-family="'JetBrains Mono', monospace" font-size="12">AOCS_STAR_TRACKER_CALIB_OK</text>

  <!-- Buttons -->
  <rect x="55" y="465" width="235" height="42" rx="6" fill="url(#cyanGold)"/>
  <text x="172" y="491" fill="#050811" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Synthesize RMAP Packet</text>

  <rect x="310" y="465" width="245" height="42" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="432" y="491" fill="#f0f4f8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Inject CRC-8 Error</text>

  <!-- Telemetry Card inside Left Block -->
  <rect x="55" y="535" width="500" height="200" rx="8" fill="#020408" stroke="#10192e"/>
  <text x="75" y="565" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="11">SPACECRAFT ORBIT &amp; AOCS TELEMETRY</text>
  
  <rect x="75" y="585" width="145" height="125" rx="6" fill="rgba(7,12,24,0.85)" stroke="rgba(0,229,255,0.2)"/>
  <text x="147" y="608" fill="#8393a8" font-family="sans-serif" font-size="9" text-anchor="middle">ORBIT ALTITUDE</text>
  <text x="147" y="650" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" text-anchor="middle">542.4</text>
  <text x="147" y="685" fill="#8393a8" font-family="sans-serif" font-size="9" text-anchor="middle">KM (LEO ORBIT)</text>

  <rect x="232" y="585" width="145" height="125" rx="6" fill="rgba(7,12,24,0.85)" stroke="rgba(0,229,255,0.2)"/>
  <text x="304" y="608" fill="#8393a8" font-family="sans-serif" font-size="9" text-anchor="middle">ORBIT VELOCITY</text>
  <text x="304" y="650" fill="#ffd700" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" text-anchor="middle">7.61</text>
  <text x="304" y="685" fill="#8393a8" font-family="sans-serif" font-size="9" text-anchor="middle">KM / SECOND</text>

  <rect x="390" y="585" width="145" height="125" rx="6" fill="rgba(7,12,24,0.85)" stroke="rgba(0,229,255,0.2)"/>
  <text x="462" y="608" fill="#8393a8" font-family="sans-serif" font-size="9" text-anchor="middle">BUS POWER</text>
  <text x="462" y="650" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" text-anchor="middle">1,480 W</text>
  <text x="462" y="685" fill="#8393a8" font-family="sans-serif" font-size="9" text-anchor="middle">28V MAIN BUS</text>

  <!-- Right Card: RMAP Dissection -->
  <rect x="610" y="140" width="560" height="620" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
  <text x="635" y="175" fill="#00e5ff" font-family="sans-serif" font-size="16" font-weight="bold">RMAP Packet &amp; CRC-8 Field Analysis</text>
  <rect x="980" y="158" width="165" height="22" rx="4" fill="rgba(0, 230, 118, 0.2)"/>
  <text x="1062" y="174" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">HEADER &amp; DATA CRC VALID</text>
  <line x1="635" y1="190" x2="1145" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- RMAP Visualizer Cells -->
  <g transform="translate(635, 215)">
    <rect x="0" y="0" width="95" height="55" fill="rgba(0, 229, 255, 0.2)" stroke="rgba(0, 229, 255, 0.5)"/>
    <text x="47" y="27" fill="#f0f4f8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">0xFE</text>
    <text x="47" y="45" fill="#8393a8" font-family="sans-serif" font-size="8" text-anchor="middle">TARGET (1B)</text>

    <rect x="95" y="0" width="125" height="55" fill="rgba(255, 215, 0, 0.2)" stroke="rgba(255, 215, 0, 0.5)"/>
    <text x="157" y="27" fill="#ffd700" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">0x01 (RMAP)</text>
    <text x="157" y="45" fill="#8393a8" font-family="sans-serif" font-size="8" text-anchor="middle">PROTO ID (1B)</text>

    <rect x="220" y="0" width="155" height="55" fill="rgba(41, 121, 255, 0.2)" stroke="rgba(41, 121, 255, 0.5)"/>
    <text x="297" y="27" fill="#f0f4f8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">0x40000000</text>
    <text x="297" y="45" fill="#8393a8" font-family="sans-serif" font-size="8" text-anchor="middle">MEM ADDRESS (4B)</text>

    <rect x="375" y="0" width="75" height="55" fill="rgba(0, 230, 118, 0.25)" stroke="rgba(0, 230, 118, 0.5)"/>
    <text x="412" y="27" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">0x3A</text>
    <text x="412" y="45" fill="#8393a8" font-family="sans-serif" font-size="8" text-anchor="middle">CRC-8 (1B)</text>

    <rect x="450" y="0" width="60" height="55" fill="rgba(213, 0, 249, 0.25)" stroke="rgba(213, 0, 249, 0.5)"/>
    <text x="480" y="27" fill="#d500f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">EOP</text>
    <text x="480" y="45" fill="#8393a8" font-family="sans-serif" font-size="8" text-anchor="middle">END TOKEN</text>
  </g>

  <!-- Detailed Analysis Block -->
  <rect x="635" y="300" width="510" height="280" rx="6" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.06)"/>
  
  <text x="655" y="335" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="13">Protocol Identifier: <tspan fill="#ffd700" font-weight="bold">0x01 (ECSS-E-ST-50-52C RMAP)</tspan></text>
  <text x="655" y="370" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="13">Instruction Field: <tspan fill="#f0f4f8">0x7C (Verified Write, Reply, Incrementing)</tspan></text>
  <text x="655" y="405" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="13">Authorization Key: <tspan fill="#00e5ff" font-weight="bold">0x55 (Valid Non-Default Access Key)</tspan></text>
  <text x="655" y="440" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="13">Transaction Sequence ID: <tspan fill="#f0f4f8">0x0100 (Sequence #256)</tspan></text>
  <text x="655" y="475" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="13">Header CRC-8 Polynomial: <tspan fill="#00e676" font-weight="bold">0x3A (x^8 + x^2 + x + 1 Valid)</tspan></text>
  <text x="655" y="510" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="13">Data CRC-8 Integrity: <tspan fill="#00e676">0xB2 (Payload Checksum Verified)</tspan></text>
  <text x="655" y="545" fill="#8393a8" font-family="'JetBrains Mono', monospace" font-size="13">Credit Flow Control: <tspan fill="#00e5ff">56 TX Credits Available (Zero Buffer Overrun)</tspan></text>

  <!-- Hex Stream -->
  <text x="635" y="615" fill="#8393a8" font-family="sans-serif" font-size="11" font-weight="bold">SERIAL WIRE BYTE STREAM (HEX)</text>
  <rect x="635" y="625" width="510" height="42" rx="6" fill="rgba(5, 8, 17, 0.7)" stroke="rgba(255,255,255,0.15)"/>
  <text x="655" y="652" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="13">FE 01 7C 55 20 00 01 00 00 40 00 00 00 00 00 1A 3A 41 4F 43 53</text>

  <!-- Audit Callout -->
  <rect x="635" y="685" width="510" height="50" rx="6" fill="rgba(0,230,118,0.06)" stroke="rgba(0,230,118,0.3)"/>
  <text x="655" y="715" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ECSS &amp; NASA MISSION AUDIT: CERTIFIED FLIGHT READY (100%)</text>
</svg>
